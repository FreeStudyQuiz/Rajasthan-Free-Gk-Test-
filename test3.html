<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>राजस्थान GK ऑनलाइन टेस्ट</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f0f4f8;
    margin: 0;
    padding: 12px;
    color: #222;
}

.container {
    max-width: 750px;
    margin: auto;
    background: white;
    padding: 18px;
    border-radius: 14px;
    box-shadow: 0 3px 12px #0002;
}

h1 {
    text-align: center;
    color: #17365d;
    font-size: 23px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 20px;
}

#username {
    width: 100%;
    padding: 13px;
    font-size: 16px;
    border: 2px solid #ccc;
    border-radius: 8px;
    margin-bottom: 18px;
}

.progress-box {
    background: #e5e7eb;
    height: 8px;
    border-radius: 10px;
    margin: 12px 0 20px;
    overflow: hidden;
}

#progress {
    height: 100%;
    width: 0%;
    background: #16803c;
    transition: width .3s;
}

.question-card {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 17px;
    min-height: 300px;
}

.question-number {
    color: #1769aa;
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 15px;
}

.question-text {
    font-size: 19px;
    font-weight: bold;
    line-height: 1.6;
    margin-bottom: 20px;
}

.option {
    display: block;
    width: 100%;
    text-align: left;
    padding: 13px;
    margin: 10px 0;
    border: 2px solid #ddd;
    border-radius: 9px;
    background: #f8fafc;
    font-size: 16px;
    line-height: 1.5;
    cursor: pointer;
    color: #222;
}

.option:disabled {
    cursor: default;
    opacity: 1;
}

.option.correct {
    background: #d4edda;
    border-color: #198754;
    color: #155724;
    font-weight: bold;
}

.option.wrong {
    background: #f8d7da;
    border-color: #dc3545;
    color: #721c24;
    font-weight: bold;
}

.explanation {
    margin-top: 15px;
    padding: 12px;
    background: #fff3cd;
    border-left: 5px solid #ffc107;
    border-radius: 6px;
    line-height: 1.6;
}

.navigation {
    display: flex;
    gap: 10px;
    margin-top: 18px;
}

.nav-btn {
    flex: 1;
    padding: 13px 8px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    color: white;
    cursor: pointer;
}

#previousBtn {
    background: #687582;
}

#nextBtn {
    background: #1769aa;
}

.nav-btn:disabled {
    background: #c4c9ce;
    color: #555;
    cursor: not-allowed;
}

#submitBtn {
    display: none;
    width: 100%;
    padding: 15px;
    margin-top: 18px;
    background: #198754;
    color: white;
    border: none;
    border-radius: 9px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

#submitBtn:disabled {
    background: #777;
}

#result {
    display: none;
    margin-top: 22px;
    padding: 18px;
    background: #e8f4ff;
    border: 2px solid #1769aa;
    border-radius: 12px;
    text-align: center;
}

.result-row {
    padding: 8px;
    font-size: 17px;
    border-bottom: 1px solid #ddd;
}

#reviewBtn {
    display: none;
    width: 100%;
    padding: 13px;
    margin-top: 12px;
    background: #6f42c1;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
}

.note {
    color: #666;
    font-size: 13px;
    text-align: center;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

    <h1>राजस्थान का भूगोल</h1>
    <div class="subtitle">अपवाह तंत्र एवं नदियाँ — ऑनलाइन MCQ टेस्ट</div>

    <input
        type="text"
        id="username"
        placeholder="अपना नाम लिखें"
        autocomplete="name"
    >

    <div class="progress-box">
        <div id="progress"></div>
    </div>

    <div id="quizArea">

        <div class="question-card">

            <div class="question-number" id="questionNumber"></div>

            <div class="question-text" id="questionText"></div>

            <div id="optionsArea"></div>

            <div id="explanation" class="explanation" hidden></div>

        </div>

        <div class="navigation">

            <button
                id="previousBtn"
                class="nav-btn"
                onclick="previousQuestion()"
            >
                ⬅ Previous
            </button>

            <button
                id="nextBtn"
                class="nav-btn"
                onclick="nextQuestion()"
            >
                Next ➡
            </button>

        </div>

        <button id="submitBtn" onclick="submitQuiz()">
            सबमिट करें एवं परिणाम देखें
        </button>

    </div>

    <div id="result">

        <h2>🏆 आपका परीक्षा परिणाम</h2>

        <div class="result-row">
            परीक्षार्थी का नाम:
            <strong id="resultName"></strong>
        </div>

        <div class="result-row">
            कुल प्रश्न:
            <strong id="totalQuestions"></strong>
        </div>

        <div class="result-row">
            सही उत्तर:
            <strong id="correctCount"></strong>
        </div>

        <div class="result-row">
            गलत उत्तर:
            <strong id="wrongCount"></strong>
        </div>

        <div class="result-row">
            छोड़े गए प्रश्न:
            <strong id="unansweredCount"></strong>
        </div>

        <div class="result-row">
            प्राप्त अंक:
            <strong id="finalScore"></strong>
        </div>

        <div class="result-row">
            प्रतिशत:
            <strong id="percentage"></strong>%
        </div>

        <div class="result-row">
            परिणाम:
            <strong id="passStatus"></strong>
        </div>

        <div class="result-row">
            प्रदर्शन:
            <strong id="rank"></strong>
        </div>

        <button id="reviewBtn" onclick="reviewAnswers()">
            उत्तरों की समीक्षा करें
        </button>

    </div>

    <div class="note">
        गलत उत्तर पर ⅓ अंक काटे जाएंगे। अनुत्तरित प्रश्न पर अंक नहीं कटेंगे।
    </div>

</div>

<script>

const quizData = [

{
    q: "राजस्थान में चम्बल और बनास नदियाँ किस प्रकार के अपवाह तंत्र का उदाहरण प्रस्तुत करती हैं?",
    options: [
        "अध्यारोपित नदी",
        "अन्तः-प्रवाह नदी",
        "पूर्ववर्ती नदी",
        "A और C दोनों"
    ],
    ans: 3,
    exp: "यह प्रश्न नदी के अपवाह तंत्र से संबंधित है। परीक्षा के लिए अपने निर्धारित पाठ्यक्रम की पुस्तक से इस तथ्य की पुष्टि करें।"
},

{
    q: "माही नदी की कुल लंबाई तथा राजस्थान में इसकी लंबाई कितनी मानी गई है?",
    options: [
        "576 किमी तथा 171 किमी",
        "495 किमी तथा 320 किमी",
        "512 किमी तथा 171 किमी",
        "465 किमी तथा 100 किमी"
    ],
    ans: 0,
    exp: "आपके दिए गए मूल प्रश्न में सही विकल्प A दिया गया था। परीक्षा में अपनी पुस्तक के नवीनतम आंकड़ों का मिलान करें।"
},

{
    q: "लूनी नदी का उद्गम स्थल कहाँ स्थित है?",
    options: [
        "नाग पहाड़, अजमेर",
        "भंवरमाता की पहाड़ी",
        "कालिंजरा की पहाड़ियाँ",
        "सेवर की पहाड़ियाँ"
    ],
    ans: 0,
    exp: "आपके मूल प्रश्न के अनुसार लूनी नदी का उद्गम अजमेर के नाग पहाड़ से होता है।"
},

{
    q: "साबरमती नदी की राजस्थान में प्रवाह लंबाई कितनी है?",
    options: [
        "416 किमी",
        "45 किमी",
        "100 किमी",
        "171 किमी"
    ],
    ans: 1,
    exp: "आपके मूल प्रश्न के अनुसार साबरमती की राजस्थान में प्रवाह लंबाई 45 किमी है।"
},

{
    q: "राजस्थान की सबसे लंबी आंतरिक अपवाह वाली नदी कौन-सी है?",
    options: [
        "कांतली नदी",
        "घग्घर नदी",
        "काकणेय नदी",
        "साबी नदी"
    ],
    ans: 1,
    exp: "आपके मूल प्रश्न में घग्घर नदी को सही उत्तर बताया गया है।"
},

{
    q: "बेणेश्वर धाम में किन नदियों का त्रिवेणी संगम होता है?",
    options: [
        "बनास, खारी और डाई",
        "माही, सोम और जाखम",
        "चम्बल, बनास और सीप",
        "बनास, बेड़च और मेनाल"
    ],
    ans: 1,
    exp: "बेणेश्वर धाम राजस्थान के प्रसिद्ध नदी संगम स्थलों में से एक है। अपने पाठ्यक्रम की पुस्तक में दिए गए संगम के विवरण से मिलान करें।"
},

{
    q: "जाखम बाँध किस जिले में स्थित है?",
    options: [
        "प्रतापगढ़",
        "बाँसवाड़ा",
        "डूंगरपुर",
        "उदयपुर"
    ],
    ans: 0,
    exp: "जाखम बाँध प्रतापगढ़ जिले में स्थित है।"
},

{
    q: "लूनी नदी का जल बालोतरा के बाद खारा हो जाने के कारण इसे किस नाम से भी जाना जाता है?",
    options: [
        "मरुगंगा",
        "आधी मीठी-आधी खारी नदी",
        "लवणवती",
        "B और C दोनों"
    ],
    ans: 3,
    exp: "आपके मूल प्रश्न में आधी मीठी-आधी खारी नदी और लवणवती दोनों नामों को सही विकल्प माना गया है।"
},

{
    q: "जवाई बाँध का निर्माण किस महाराजा के शासनकाल में करवाया गया था?",
    options: [
        "महाराजा उम्मेद सिंह",
        "महाराजा रामसिंह",
        "महाराजा गंगा सिंह",
        "महाराजा अजीत सिंह"
    ],
    ans: 0,
    exp: "यह प्रश्न जवाई बाँध के निर्माण से संबंधित है। अपने पाठ्यक्रम में दिए गए निर्माण वर्ष और शासक के विवरण का मिलान करें।"
},

{
    q: "आपके मूल प्रश्न के अनुसार राजस्थान में किन जिलों में नदी प्रवाह नहीं माना गया है?",
    options: [
        "बीकानेर और चूरू",
        "जैसलमेर और बाड़मेर",
        "पाली और सिरोही",
        "डूंगरपुर और बाँसवाड़ा"
    ],
    ans: 0,
    exp: "यह प्रश्न आपके मूल कोड से लिया गया है। जिलों के पुनर्गठन तथा नदी प्रवाह संबंधी तथ्य अपनी नवीनतम पुस्तक से सत्यापित करें।"
}

];

let currentQuestion = 0;
let userAnswers = new Array(quizData.length).fill(null);
let submitted = false;
let reviewMode = false;

function renderQuestion() {

    const q = quizData[currentQuestion];

    document.getElementById("questionNumber").textContent =
        "प्रश्न " + (currentQuestion + 1) + " / " + quizData.length;

    document.getElementById("questionText").textContent = q.q;

    document.getElementById("progress").style.width =
        ((currentQuestion + 1) / quizData.length * 100) + "%";

    const optionsArea = document.getElementById("optionsArea");
    optionsArea.innerHTML = "";

    q.options.forEach(function(option, index) {

        const button = document.createElement("button");
        button.className = "option";
        button.textContent =
            String.fromCharCode(65 + index) + ". " + option;

        if (userAnswers[currentQuestion] === index && !submitted) {
            button.style.borderColor = "#1769aa";
            button.style.background = "#e5f2ff";
        }

        if (submitted) {

            if (index === q.ans) {
                button.classList.add("correct");
            }

            if (
                userAnswers[currentQuestion] === index &&
                index !== q.ans
            ) {
                button.classList.add("wrong");
            }

            button.disabled = true;

        } else {

            button.onclick = function() {
                selectAnswer(index);
            };

        }

        optionsArea.appendChild(button);

    });

    const explanation = document.getElementById("explanation");

    if (submitted) {
        explanation.hidden = false;
        explanation.textContent = "व्याख्या: " + q.exp;
    } else {
        explanation.hidden = true;
        explanation.textContent = "";
    }

    document.getElementById("previousBtn").disabled =
        currentQuestion === 0;

    document.getElementById("nextBtn").disabled =
        currentQuestion === quizData.length - 1;

    document.getElementById("nextBtn").style.display =
        currentQuestion === quizData.length - 1 ? "none" : "block";

    document.getElementById("submitBtn").style.display =
        currentQuestion === quizData.length - 1 && !submitted
        ? "block"
        : "none";

    if (submitted) {
        document.getElementById("nextBtn").style.display = "none";
        document.getElementById("previousBtn").style.display = "block";
    }

}

function selectAnswer(index) {

    if (submitted) return;

    userAnswers[currentQuestion] = index;

    renderQuestion();

}

function nextQuestion() {

    if (currentQuestion < quizData.length - 1) {
        currentQuestion++;
        renderQuestion();
        window.scrollTo({ top: 0, behavior: "smooth" });
    }

}

function previousQuestion() {

    if (currentQuestion > 0) {
        currentQuestion--;
        renderQuestion();
        window.scrollTo({ top: 0, behavior: "smooth" });
    }

}

function submitQuiz() {

    if (submitted) return;

    const name = document.getElementById("username").value.trim();

    if (!name) {
        alert("कृपया पहले अपना नाम लिखें।");
        document.getElementById("username").focus();
        return;
    }

    const unanswered = userAnswers.filter(
        answer => answer === null
    ).length;

    if (unanswered > 0) {

        const confirmSubmit = confirm(
            "आपने " + unanswered +
            " प्रश्नों के उत्तर नहीं दिए हैं। क्या आप टेस्ट सबमिट करना चाहते हैं?"
        );

        if (!confirmSubmit) return;

    }

    let correct = 0;
    let wrong = 0;

    userAnswers.forEach(function(answer, index) {

        if (answer === null) return;

        if (answer === quizData[index].ans) {
            correct++;
        } else {
            wrong++;
        }

    });

    let score = correct - (wrong / 3);

    if (score < 0) score = 0;

    score = Math.round(score * 100) / 100;

    const percentage = (
        score / quizData.length * 100
    ).toFixed(2);

    let status = percentage >= 40
        ? "उत्तीर्ण ✅"
        : "अनुत्तीर्ण ❌";

    let rank = "रैंक 5";

    if (percentage >= 90) {
        rank = "रैंक 1 🏆";
    } else if (percentage >= 75) {
        rank = "रैंक 2 🌟";
    } else if (percentage >= 60) {
        rank = "रैंक 3 👍";
    } else if (percentage >= 40) {
        rank = "रैंक 4 ✅";
    }

    submitted = true;

    document.getElementById("resultName").textContent = name;
    document.getElementById("totalQuestions").textContent = quizData.length;
    document.getElementById("correctCount").textContent = correct;
    document.getElementById("wrongCount").textContent = wrong;
    document.getElementById("unansweredCount").textContent = unanswered;
    document.getElementById("finalScore").textContent =
        score + " / " + quizData.length;
    document.getElementById("percentage").textContent = percentage;
    document.getElementById("passStatus").textContent = status;
    document.getElementById("rank").textContent = rank;

    document.getElementById("result").style.display = "block";
    document.getElementById("reviewBtn").style.display = "block";
    document.getElementById("username").disabled = true;

    renderQuestion();

    window.scrollTo({ top: 0, behavior: "smooth" });

}

function reviewAnswers() {

    document.getElementById("result").style.display = "none";

    currentQuestion = 0;

    renderQuestion();

    document.getElementById("quizArea").scrollIntoView({
        behavior: "smooth"
    });

}

renderQuestion();

</script>

</body>
</html>
