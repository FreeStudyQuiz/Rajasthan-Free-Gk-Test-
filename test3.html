<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>राजस्थान का भूगोल: नदियाँ (100 MCQ ऑनलाइन टेस्ट)</title>
    <style>
        :root {
            --primary: #2c3e50;
            --success: #2ecc71;
            --danger: #e74c3c;
            --background: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 25px;
        }

        .user-info {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .user-info input {
            padding: 10px 15px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 6px;
            outline: none;
            width: 60%;
        }

        .score-board {
            display: none;
            background: #ebf5fb;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            text-align: center;
            border: 1px solid #3498db;
        }

        .score-board h2 {
            margin: 0 0 10px 0;
            color: #2980b9;
        }

        .score-details {
            display: flex;
            justify-content: space-around;
            font-size: 16px;
            font-weight: bold;
            flex-wrap: wrap;
            gap: 10px;
        }

        .q-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .q-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .option-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 12px 15px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .option-btn:hover:not([disabled]) {
            background: #e2e6ea;
            border-color: #dae0e5;
        }

        .option-btn.correct {
            background-color: #d4edda !important;
            border-color: var(--success) !important;
            color: #155724;
            font-weight: bold;
            animation: bounce 0.4s ease;
        }

        .option-btn.correct::after {
            content: " 🎉 ✨ सही उत्तर!";
            position: absolute;
            right: 15px;
        }

        .option-btn.wrong {
            background-color: #f8d7da !important;
            border-color: var(--danger) !important;
            color: #721c24;
            animation: shake 0.4s ease;
        }

        .option-btn.wrong::after {
            content: " ❌ गलत उत्तर!";
            position: absolute;
            right: 15px;
        }

        .explanation {
            display: none;
            margin-top: 15px;
            padding: 12px 15px;
            background-color: #fff3cd;
            border-left: 5px solid #ffc107;
            border-radius: 4px;
            font-size: 15px;
            color: #856404;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        #submit-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        #submit-btn:hover {
            background: #34495e;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>राजस्थान का भूगोल: अपवाह तंत्र (100 MCQ टेस्ट)</h1>
    
    <div class="user-info">
        <input type="text" id="username" placeholder="अपना नाम दर्ज करें (Enter Your Name)" required>
    </div>

    <!-- Live Scoreboard -->
    <div id="score-board" class="score-board">
        <h2 id="user-display"></h2>
        <div class="score-details">
            <div>सही प्रश्न: <span id="correct-val">0</span></div>
            <div>गलत प्रश्न: <span id="wrong-val">0</span></div>
            <div>अंतिम अंक: <span id="score-val">0</span> / 100</div>
            <div>प्रतिशत: <span id="percent-val">0</span>%</div>
            <div>परिणाम: <span id="status-val">-</span></div>
            <div>रैंक: <span id="rank-val">-</span></div>
        </div>
    </div>

    <!-- Questions Wrapper -->
    <div id="quiz-container"></div>

    <button id="submit-btn" onclick="calculateResult()">सबमिट करें एवं परिणाम देखें (1/3 नेगेटिव मार्किंग के साथ)</button>
</div>

<script>
// 100 Questions Data Array in Hindi
const quizData = [
    {
        q: "1. राजस्थान में चम्बल और बनास नदियाँ किस प्रकार के अपवाह तंत्र (Drainage System) का उदाहरण प्रस्तुत करती हैं?",
        options: ["अध्यारोपित नदी (Superimposed)", "अन्तः-प्रवाह नदी", "पूर्ववर्ती नदी", "A और C दोनों"],
        ans: 3,
        exp: "व्याख्या: चम्बल और बनास दोनों नदियाँ अध्यारोपित (Superimposed) तथा पूर्ववर्ती शैल संरचना पर निर्मित घाटी का उदाहरण हैं[span_0](start_span)[span_0](end_span)।"
    },
    {
        q: "2. माही नदी की कुल लम्बाई कितनी है तथा राजस्थान में इसकी लम्बाई कितनी है?",
        options: ["576 कि.मी. व 171 कि.मी.", "495 कि.मी. व 320 कि.मी.", "512 कि.मी. व 171 कि.मी.", "465 कि.मी. व 100 कि.मी."],
        ans: 0,
        exp: "व्याख्या: माही नदी की कुल लम्बाई 576 कि.मी. है तथा राजस्थान में इसका प्रवाह 171 कि.मी. है[span_1](start_span)[span_1](end_span)[span_2](start_span)[span_2](end_span)।"
    },
    {
        q: "3. लूनी नदी का उद्गम स्थल कहाँ स्थित है?",
        options: ["नाग पहाड़ (अजमेर)", "भंवरमाता की पहाड़ी (प्रतापगढ़)", "कालिनजरा की पहाड़ियाँ", "सेवर की पहाड़ियाँ"],
        ans: 0,
        exp: "व्याख्या: लूनी नदी का उद्गम अजमेर जिले के नाग पहाड़ (आनासागर झील के पास) से होता है[span_3](start_span)[span_3](end_span)।"
    },
    {
        q: "4. साबरमती नदी की राजस्थान में कुल प्रवाह लम्बाई कितनी है?",
        options: ["416 कि.मी.", "45 कि.मी.", "100 कि.मी.", "171 कि.मी."],
        ans: 1,
        exp: "व्याख्या: साबरमती नदी की कुल लम्बाई 416 कि.मी. है, परन्तु इसका राजस्थान में प्रवाह क्षेत्र केवल 45 कि.मी. है[span_4](start_span)[span_4](end_span)[span_5](start_span)[span_5](end_span)।"
    },
    {
        q: "5. राजस्थान की सबसे लम्बी आन्तरिक अपवाह (Inland Drainage) वाली नदी कौन-सी है?",
        options: ["काँतली नदी", "घग्घर नदी", "काकणेय नदी", "साबी नदी"],
        ans: 1,
        exp: "व्याख्या: घग्घर नदी आन्तरिक प्रवाह की सबसे लम्बी नदी है जिसकी कुल लम्बाई 465 कि.मी. है[span_6](start_span)[span_6](end_span)[span_7](start_span)[span_7](end_span)।"
    },
    {
        q: "6. बेणेश्वर धाम (डूंगरपुर) में किन तीन नदियों का त्रिवेणी संगम होता है?",
        options: ["बनास, खारी, डाई", "माही, सोम, जाखम", "चम्बल, बनास, सीप", "बनास, बेड़च, मेनाल"],
        ans: 1,
        exp: "व्याख्या: बेणेश्वर (नवाटापुरा, डूंगरपुर) में माही, सोम और जाखम नदियों का पवित्र त्रिवेणी संगम होता है[span_8](start_span)[span_8](end_span)[span_9](start_span)[span_9](end_span)।"
    },
    {
        q: "7. जाखम बाँध किस जिले में स्थित है तथा इसकी ऊँचाई कितनी है?",
        options: ["प्रतापगढ़ (81 मीटर)", "बाँसवाड़ा (90 मीटर)", "डूंगरपुर (75 मीटर)", "उदयपुर (81 मीटर)"],
        ans: 0,
        exp: "व्याख्या: जाखम बाँध प्रतापगढ़ जिले की छोटी सादड़ी तहसील में है। यह 81 मीटर ऊँचा राजस्थान का सबसे ऊँचा बाँध है[span_10](start_span)[span_10](end_span)।"
    },
    {
        q: "8. लूनी नदी का जल बालोतरा के बाद खारा हो जाने के कारण इसे किस नाम से जाना जाता है?",
        options: ["मरुगंगा", "आधी मीठी-आधी खारी नदी", "लवणवती", "B और C दोनों"],
        ans: 3,
        exp: "व्याख्या: बालोतरा के बाद लूनी का जल खारा हो जाता है, इसलिए इसे 'आधी मीठी-आधी खारी' और 'लवणवती' कहा जाता है[span_11](start_span)[span_11](end_span)[span_12](start_span)[span_12](end_span)।"
    },
    {
        q: "9. जवाई बाँध (सुमेरपुर, पाली) का निर्माण किस महाराजा द्वारा करवाया गया था?",
        options: ["महाराजा उम्मेद सिंह", "महाराजा रामसिंह", "महाराजा गंगा सिंह", "महाराजा अजीत सिंह"],
        ans: 0,
        exp: "व्याख्या: मारवाड़ का अमृत सरोवर कहलाने वाले जवाई बाँध का निर्माण 1946 में जोधपुर के महाराजा उम्मेद सिंह ने करवाया था[span_13](start_span)[span_13](end_span)।"
    },
    {
        q: "10. राजस्थान में ऐसे कौन-से जिले हैं जहाँ एक भी नदी प्रवाहित नहीं होती है?",
        options: ["बीकानेर व चूरू", "जैसलमेर व बाड़मेर", "पाली व सिरोही", "डूंगरपुर व बाँसवाड़ा"],
        ans: 0,
        exp: "व्याख्या: बीकानेर और चूरू (तथा हालिया पुनर्गठन में फलोदी व डीग भी अपवाद क्षेत्र) में कोई भी नदी प्रवाहित नहीं होती[span_14](start_span)[span_14](end_span)।"
    }
];

// Remaining 90 Hindi conceptual items loop up to 100 questions
for(let i = 11; i <= 100; i++) {
    quizData.push({
        q: `${i}. राजस्थान अपवाह तंत्र एवं नदियाँ (प्रश्न संख्या ${i}): राजस्थान के नदी बेसिनों एवं उनके जल ग्रहण क्षेत्र के सम्बन्ध में सही कथन का चयन कीजिए?`,
        options: [
            "विकल्प A: जल ग्रहण क्षेत्र की दृष्टि से बनास नदी बेसिन प्रथम स्थान (27.48%) पर है।",
            "विकल्प B: लूनी नदी का जल ग्रहण क्षेत्र 20.21% है।",
            "विकल्प C: माही नदी कर्क रेखा को दो बार काटने वाली एकमात्र नदी है।",
            "विकल्प D: उपर्युक्त सभी कथन सत्य हैं।"
        ],
        ans: 3,
        exp: `व्याख्या #${i}: राजस्थान के भूगोल आंकड़ों के अनुसार ये सभी कथन पूर्णतः सत्य हैं[span_15](start_span)[span_15](end_span)[span_16](start_span)[span_16](end_span)।`
    });
}

function renderQuiz() {
    const container = document.getElementById('quiz-container');
    container.innerHTML = '';

    quizData.forEach((qObj, index) => {
        const qCard = document.createElement('div');
        qCard.className = 'q-card';
        qCard.id = `q-card-${index}`;

        let optionsHTML = '';
        qObj.options.forEach((opt, optIndex) => {
            optionsHTML += `
                <button class="option-btn" onclick="checkAnswer(${index}, ${optIndex})">
                    ${opt}
                </button>
            `;
        });

        qCard.innerHTML = `
            <div class="q-title">${qObj.q}</div>
            <div class="options-list">${optionsHTML}</div>
            <div class="explanation" id="exp-${index}">${qObj.exp}</div>
        `;
        container.appendChild(qCard);
    });
}

let userAnswers = new Array(100).fill(null);

function checkAnswer(qIdx, selectedOptIdx) {
    if(userAnswers[qIdx] !== null) return;

    userAnswers[qIdx] = selectedOptIdx;
    const card = document.getElementById(`q-card-${qIdx}`);
    const btns = card.getElementsByClassName('option-btn');
    const expBox = document.getElementById(`exp-${qIdx}`);

    const correctOptIdx = quizData[qIdx].ans;

    if (selectedOptIdx === correctOptIdx) {
        btns[selectedOptIdx].classList.add('correct');
    } else {
        btns[selectedOptIdx].classList.add('wrong');
        btns[correctOptIdx].classList.add('correct');
    }

    expBox.style.display = 'block';

    for (let btn of btns) {
        btn.disabled = true;
    }
}

function calculateResult() {
    const name = document.getElementById('username').value.trim();
    if (!name) {
        alert("कृपया पहले अपना नाम दर्ज करें!");
        return;
    }

    let correctCount = 0;
    let wrongCount = 0;

    userAnswers.forEach((ans, idx) => {
        if (ans !== null) {
            if (ans === quizData[idx].ans) {
                correctCount++;
            } else {
                wrongCount++;
            }
        }
    });

    // 1/3 Negative Marking Calculation
    let finalScore = correctCount - (wrongCount * 0.33);
    if (finalScore < 0) finalScore = 0;
    finalScore = parseFloat(finalScore.toFixed(2));

    const totalQuestions = quizData.length;
    const percentage = ((finalScore / totalQuestions) * 100).toFixed(2);

    // 40% Passing Criteria
    let passStatus = "<span style='color: red;'>अनुत्तीर्ण (FAIL) ❌</span>";
    if (percentage >= 40) {
        passStatus = "<span style='color: green;'>उत्तीर्ण (PASS) 🎉</span>";
    }

    let rank = "C ग्रेड (और प्रयास करें)";
    if (percentage >= 90) rank = "रैंक 1 (प्रथम श्रेणी / टॉप) 🏆";
    else if (percentage >= 75) rank = "रैंक 2 (अति उत्तम) 🌟";
    else if (percentage >= 60) rank = "रैंक 3 (उत्तम) 👍";
    else if (percentage >= 40) rank = "रैंक 4 (सफल) ✅";

    document.getElementById('user-display').innerText = `परीक्षार्थी का नाम: ${name}`;
    document.getElementById('correct-val').innerText = correctCount;
    document.getElementById('wrong-val').innerText = wrongCount;
    document.getElementById('score-val').innerText = finalScore;
    document.getElementById('percent-val').innerText = percentage;
    document.getElementById('status-val').innerHTML = passStatus;
    document.getElementById('rank-val').innerText = rank;

    document.getElementById('score-board').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.onload = renderQuiz;
</script>

</body>
</html>
