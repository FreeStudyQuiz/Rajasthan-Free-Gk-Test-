<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>राजस्थान भूगोल — नदी तंत्र MCQ टेस्ट</title>
<style>
:root{--navy:#14213d;--blue:#2563eb;--bg:#f3f6fb;--green:#16803c;--red:#d62828}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#eaf2ff,#f8fafc);font-family:Arial,sans-serif;color:#172033}
.wrap{max-width:760px;margin:auto;padding:16px}
.hero{background:linear-gradient(120deg,#14213d,#2563eb);color:white;padding:22px;border-radius:20px}
.hero h1{font-size:24px;margin:0 0 8px}
.hero p{line-height:1.6}
.badge{display:inline-block;background:#ffffff20;padding:8px;border-radius:20px}
.panel,.quiz,.result{background:white;margin-top:16px;padding:20px;border-radius:18px;box-shadow:0 6px 22px #17203312}
label{font-weight:bold;display:block;margin-bottom:8px}
input[type=text]{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px}
button{border:0;border-radius:12px;padding:13px 18px;font-size:16px;font-weight:bold;cursor:pointer}
.primary{background:#2563eb;color:white;width:100%;margin-top:14px}
.secondary{background:#e8eefb;color:#183153}
.topline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:bold}
.track{height:8px;background:#e2e8f0;border-radius:20px;overflow:hidden;margin:14px 0}
.bar{height:100%;background:#2563eb;width:0}
.qnum{color:#2563eb;font-weight:bold}
.question{font-size:21px;line-height:1.6;margin:12px 0 18px;font-weight:bold}
.option{display:block;width:100%;text-align:left;background:#f8fafc;border:2px solid #e2e8f0;margin:10px 0;padding:14px;border-radius:12px;color:#172033;font-size:16px}
.option:disabled{cursor:default}
.option.correct{background:#dcfce7;border-color:#16803c;color:#14532d}
.option.wrong{background:#fee2e2;border-color:#d62828;color:#7f1d1d}
.feedback{font-weight:bold;margin:12px 0;min-height:24px}
.controls{display:flex;gap:10px;margin-top:14px}
.controls button{flex:1}
.muted{color:#64748b;font-size:14px;line-height:1.6}
.hide{display:none}
.score{font-size:38px;font-weight:900}
.pass{color:#16803c}
.fail{color:#d62828}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left}
th{background:#eff6ff}
@media(max-width:480px){
.wrap{padding:10px}
.hero h1{font-size:21px}
.panel,.quiz,.result{padding:16px}
.question{font-size:19px}
}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
<h1>🏞️ राजस्थान भूगोल: नदी तंत्र MCQ टेस्ट</h1>
<p>120 प्रश्न • एक समय में एक प्रश्न • सही उत्तर हरा और गलत उत्तर लाल</p>
<span class="badge">पास होने के लिए कम-से-कम 40% अंक जरूरी</span>
</header>

<section class="panel" id="start">
<label for="studentName">अपना नाम लिखें</label>
<input id="studentName" type="text" maxlength="40" placeholder="अपना नाम लिखें">
<p class="muted">हर सही उत्तर के 1 अंक। गलत उत्तर के 0 अंक। 120 में से 48 अंक लाने पर PASS होगा।</p>
<button class="primary" onclick="startTest()">टेस्ट शुरू करें →</button>
</section>

<section class="quiz hide" id="quiz">
<div class="topline">
<span id="progressText">प्रश्न 1/120</span>
<span id="scoreText">अंक: 0</span>
</div>
<div class="track"><div class="bar" id="bar"></div></div>
<div class="qnum" id="qnum"></div>
<div class="question" id="question"></div>
<div id="options"></div>
<div class="feedback" id="feedback"></div>
<div class="controls">
<button class="secondary" id="nextBtn" onclick="nextQuestion()" disabled>अगला प्रश्न →</button>
</div>
</section>

<section class="result hide" id="result"></section>
</div>
